name: build

on:
  push:
    branches: ['**']
    tags: ['v*', '[0-9]*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Тег уже созданного релиза, например 1.0.0 — собрать для него APK. Пусто — обычная сборка.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Release build: a pushed version tag (v1.2.3 or 1.2.3) or a manual run for an existing release.
      RELEASE_TAG: ${{ github.event.inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/autovol.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/autovol.jks" >> "$GITHUB_ENV"
            echo "Подпись: ключ из секретов"
          else
            echo "::warning::Секрет KEYSTORE_BASE64 не задан — APK подписан случайным debug-ключом, обновление поверх не встанет"
          fi

      # Robolectric Android images (Android 10/12/14/16), ~800 MB: download once.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Unit + Robolectric tests (Android 10, 12, 14, 16)
        run: ./gradlew --stacktrace testDebugUnitTest

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-${{ github.run_number }}
          path: app/build/outputs/roborazzi/*.png

      - name: Debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew --stacktrace assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: autovol-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk

      # Test build for the phone while work is in progress (not from main, not for releases).
      # Every release deletes it again; the in-app updater ignores pre-releases.
      - name: Test pre-release
        if: github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name != 'main'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AutoVol-test.apk
          gh release delete dev --yes --cleanup-tag || true
          gh release create dev AutoVol-test.apk --prerelease --target "$GITHUB_SHA" \
            --title "Тестовая сборка" \
            --notes "Для проверки перед выходом новой версии. Обычным пользователям нужен последний релиз, а не эта сборка."

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/

      - name: Release APK
        if: env.RELEASE_TAG != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_FILE" ]; then echo "::error::Для релиза нужны секреты подписи (docs/SIGNING.md)"; exit 1; fi
          name=$(sed -n 's/^val appVersionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/^val appVersionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          if [ "${RELEASE_TAG#v}" != "$name" ]; then
            echo "::error::Тег $RELEASE_TAG не совпадает с версией $name в app/build.gradle.kts"; exit 1
          fi
          # a manual run is not a tag ref: tell Gradle it is a release version anyway
          GITHUB_REF_TYPE=tag ./gradlew --stacktrace assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "AutoVol-$name.apk"
          # release text from the commit this workflow runs for (a manual run for an older tag gets
          # the current wording), falling back to the checked-out tag
          git fetch -q --depth 1 origin "$GITHUB_SHA" || true
          notes() { git show "$GITHUB_SHA:fastlane/metadata/android/$1/changelogs/$code.txt" 2>/dev/null ||
            cat "fastlane/metadata/android/$1/changelogs/$code.txt"; }
          { notes ru-RU; printf '\n---\n\n'; notes en-US; } > release-notes.md
          echo "APK=AutoVol-$name.apk" >> "$GITHUB_ENV"
          echo "VERSION=$name" >> "$GITHUB_ENV"

      - name: Publish release
        if: env.RELEASE_TAG != ''
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK" --clobber
            gh release edit "$RELEASE_TAG" --title "AutoVol $VERSION" --notes-file release-notes.md --prerelease=false --draft=false --latest
          else
            gh release create "$RELEASE_TAG" "$APK" --title "AutoVol $VERSION" --notes-file release-notes.md --latest
          fi
          # old test builds are not needed once a version is out
          gh release list --limit 100 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease) | .tagName' |
            while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done

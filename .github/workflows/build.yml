name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/autovol.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/autovol.jks" >> "$GITHUB_ENV"
            echo "Подпись: ключ из секретов"
          else
            echo "::warning::Секрет KEYSTORE_BASE64 не задан — APK подписан случайным debug-ключом, обновление поверх не встанет"
          fi

      # Robolectric Android images (Android 10/12/14/16), ~800 MB: download once.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Unit + Robolectric tests (Android 10, 12, 14, 16)
        run: ./gradlew --stacktrace testDebugUnitTest

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-${{ github.run_number }}
          path: app/build/outputs/roborazzi/*.png

      - name: Debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew --stacktrace assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: autovol-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/

      - name: Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_FILE" ]; then echo "::error::Для релиза нужны секреты подписи"; exit 1; fi
          ./gradlew --stacktrace assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "AutoVol-${GITHUB_REF_NAME}.apk"

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: AutoVol-${{ github.ref_name }}.apk
          generate_release_notes: true
